# docs: https://docs.flet.dev/publish/web/static-website/hosting/github-pages/

name: Web Build + Deploy to GitHub Pages

on:
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab of the repository
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, does not cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  UV_PYTHON: 3.12   # Python version

  FLET_CLI_NO_RICH_OUTPUT: 1
  
jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build app
        shell: bash
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt   
          sed -i 's|os.environ.get("WORKER", "")|"${{ secrets.WORKER }}/"|g' src/core/session.py
          flet build web src --yes --verbose --base-url ${GITHUB_REPOSITORY#*/} --route-url-strategy hash

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: src/build/web
          name: web-build-artifact
          retention-days: 20

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # deploy only on push to main
    needs: build  # wait for the "build" job to get done
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: web-build-artifact
