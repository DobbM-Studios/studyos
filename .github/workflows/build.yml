name: Build Flet App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Desktop (always) --------
          - name: linux
            runner: ubuntu-latest
            build_cmd: "flet build linux src"
            artifact_path: src/build/linux
            needs_linux_deps: true
            is_mobile_web: false

          - name: macos
            runner: macos-latest
            build_cmd: "flet build macos src"
            artifact_path: src/build/macos
            needs_linux_deps: false
            is_mobile_web: false

          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows src"
            artifact_path: src/build/windows
            needs_linux_deps: false
            is_mobile_web: false

          # -------- Android (release only) --------
          - name: aab
            runner: ubuntu-latest
            build_cmd: "flet build aab src"
            artifact_path: src/build/aab
            needs_linux_deps: false
            is_mobile_web: true

          - name: apk
            runner: ubuntu-latest
            build_cmd: "flet build apk src"
            artifact_path: src/build/apk
            needs_linux_deps: false
            is_mobile_web: true

          # -------- iOS (release only) --------
          - name: ipa
            runner: macos-latest
            build_cmd: "flet build ipa src"
            artifact_path: src/build/ipa
            needs_linux_deps: false
            is_mobile_web: true

          # -------- Web (release only) --------
          - name: web
            runner: ubuntu-latest
            build_cmd: "flet build web src"
            artifact_path: src/build/web
            needs_linux_deps: false
            is_mobile_web: true

    steps:
      - name: Checkout repository
        if: matrix.is_mobile_web == false || (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup uv
        if: matrix.is_mobile_web == false || (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps && (matrix.is_mobile_web == false || (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          WORKER: ${{ secrets.WORKER }} 
        run: |
          sudo apt update --allow-releaseinfo-change
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build libgtk-3-dev libasound2-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-qt5 gstreamer1.0-pulseaudio pkg-config libsecret-1-0 libsecret-1-dev
          sudo apt-get clean

      - name: Build app
        if: matrix.is_mobile_web == false || (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          uv run --with-requirements requirements.txt ${{ matrix.build_cmd }} --yes --verbose

      - name: Upload Artifact
        if: matrix.is_mobile_web == false || (github.event_name == 'release' && github.event.action == 'published') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false
